services:
  spark:
    image: apache/spark:4.0.0
    container_name: spark
    user: "50000:0"
    ports:
      - "8080:8080"
    volumes:
      - ../data:/data
      - ../spark_jobs:/spark_jobs
      - ../pipeline:/pipeline
    command: tail -f /dev/null

  airflow:
    build: .
    image: airflow-custom:latest
    container_name: airflow
    user: "50000:0"
    depends_on:
      spark:
        condition: service_started
    env_file:
      - ../.env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__FERNET_KEY: $${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "$${AIRFLOW_ADMIN_USER}:admin"
      PYTHONPATH: "/opt/airflow"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../spark_jobs:/opt/airflow/spark_jobs
      - ../pipeline:/opt/airflow/pipeline
      - ../monitoring:/opt/airflow/monitoring
      - ../utils:/opt/airflow/utils
      - ../dashboard:/opt/airflow/dashboard
      - ../data:/data
    ports:
      - "8081:8080"
    command: >
      bash -c "python3 -c \"import pipeline.config\" && python3 -c \"import os, json; json.dump({os.environ.get('AIRFLOW_ADMIN_USER', 'admin'): os.environ.get('AIRFLOW_ADMIN_PASSWORD', 'admin123')}, open('/opt/airflow/simple_auth_manager_passwords.json.generated', 'w'))\" && exec airflow standalone"


  streamlit:
    image: airflow-custom:latest
    container_name: streamlit
    user: "50000:0"
    depends_on:
      airflow:
        condition: service_started
    env_file:
      - ../.env
    environment:
      PYTHONPATH: "/app"
      AIRFLOW_API_URL: "http://airflow:8080"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../dashboard:/app
      - ../pipeline:/app/pipeline
      - ../spark_jobs:/app/spark_jobs
      - ../monitoring:/app/monitoring
      - ../utils:/app/utils
      - ../data:/data
    ports:
      - "8501:8501"
    entrypoint: []
    command: >
      bash -c "python3 -c \"import pipeline.config\" && exec streamlit run /app/app.py --server.port=8501 --server.address=0.0.0.0"