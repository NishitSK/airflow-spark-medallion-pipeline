services:
  spark:
    image: apache/spark:4.0.0
    container_name: spark
    ports:
      - "8080:8080"
    volumes:
      - ../data:/data
      - ../spark_jobs:/spark_jobs
      - ../pipeline:/pipeline
    command: tail -f /dev/null

  airflow:
    build: .
    container_name: airflow
    depends_on:
      - spark
    env_file:
      - ../.env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER}:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/simple_auth_manager_passwords.json"
      PYTHONPATH: "/opt/airflow"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../spark_jobs:/opt/airflow/spark_jobs
      - ../pipeline:/opt/airflow/pipeline
      - ../monitoring:/opt/airflow/monitoring
      - ../data:/data
    ports:
      - "8081:8080"
    command: bash -c "python -c \"import os, json; json.dump({os.environ.get('AIRFLOW_ADMIN_USER', 'admin'): os.environ.get('AIRFLOW_ADMIN_PASSWORD', 'admin123')}, open('/opt/airflow/simple_auth_manager_passwords.json', 'w'))\" && exec airflow standalone"

  streamlit:
    build: .
    container_name: streamlit
    env_file:
      - ../.env
    environment:
      PYTHONPATH: "/app"
      AIRFLOW_ADMIN_USER: "${AIRFLOW_ADMIN_USER}"
      AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD}"
    volumes:
      - ../dashboard:/app
      - ../pipeline:/app/pipeline
      - ../data:/data
    ports:
      - "8501:8501"
    entrypoint: ["streamlit"]
    command: ["run", "/app/app.py", "--server.port=8501", "--server.address=0.0.0.0"]